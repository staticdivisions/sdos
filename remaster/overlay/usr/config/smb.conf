# sdOS (Static Divisions): one password-protected games share.

# samba.conf v4 (do not remove)

# On a computer open \\sdos\games (or \\<handheld IP>\games).
# Log in as user "sdos" (or "root") with the root password, "sdos" unless you changed it.

[global]
  server string = sdOS
  netbios name = SDOS
  workgroup = WORKGROUP
  unix extensions = no
  browseable = yes
  writeable = yes
  printable = no
  deadtime = 30
  mangled names = no
  name resolve order = host bcast
  printcap name = /dev/null
  load printers = no
  enable core files = no
  passdb backend = smbpasswd
  smb passwd file = /storage/.cache/samba/smbpasswd
  username map = /etc/samba/sdos-users.map
  fruit:model = Xserve

  # no guest access (Windows 11 refuses guest shares anyway)
  security = user
  map to guest = Never
  server min protocol = SMB2_02

  # samba tuning options
  socket options = TCP_NODELAY IPTOS_LOWDELAY
  min receivefile size = 16384
  aio read size = 16384
  aio write size = 16384
  use sendfile = yes

  # "strict allocate = yes" breaks large network transfers to external hdd
  strict allocate = no

[games]
  comment = sdOS games (one folder per system)
  path = /storage/roms
  available = yes
  browseable = yes
  writeable = yes
  valid users = root
  force user = root
  veto files = /._*/.DS_Store/
  delete veto files = yes

[logs]
  comment = sdOS logs (read only)
  path = /var/log
  available = yes
  browseable = yes
  read only = yes
  valid users = root

[config]
  comment = sdOS settings (advanced)
  path = /storage/.config
  available = yes
  browseable = no
  writeable = yes
  valid users = root
